<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>数码 3C 客服</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#1b2333; --muted:#6b7a90;
    --brand:#2f6bff; --brand-ink:#fff; --line:#e6eaf2; --danger:#c0392b;
  }
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(1200px 600px at 85% -10%,#e8efff 0%,transparent 60%),var(--bg);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex;justify-content:center;padding:24px;
  }
  .app{width:min(760px,100%);height:calc(100dvh - 48px);display:flex;flex-direction:column;background:var(--card);
    border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(20,40,90,.10);overflow:hidden}
  header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:#fff}
  .avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2f6bff,#7aa2ff);
    color:#fff;display:grid;place-items:center;font-size:16px;flex:0 0 auto}
  .title{font-weight:600;font-size:15px;line-height:1.2}
  .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .grow{flex:1}
  button{font:inherit}
  .ghost{border:1px solid var(--line);background:#fff;color:var(--muted);padding:7px 12px;border-radius:10px;
    cursor:pointer;font-size:13px;transition:.15s}
  .ghost:hover{color:var(--ink);border-color:#c9d4e8}
  .ghost:disabled{opacity:.5;cursor:not-allowed}
  main{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
  .row{display:flex;gap:10px;align-items:flex-end;animation:pop .18s ease-out}
  .row.me{flex-direction:row-reverse}
  .bubble{max-width:76%;padding:11px 14px;border-radius:14px;line-height:1.65;font-size:14.5px;
    white-space:pre-wrap;word-break:break-word}
  .row.me .bubble{background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px}
  .row.bot .bubble{background:#f1f4fa;border:1px solid var(--line);border-bottom-left-radius:4px}
  .row.err .bubble{background:#fdecea;border:1px solid #f5c6c0;color:var(--danger);font-size:13.5px}
  .typing{display:inline-flex;gap:4px;align-items:center;height:1.65em}
  .typing i{width:6px;height:6px;border-radius:50%;background:#9fb0c9;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  footer{padding:12px 14px;border-top:1px solid var(--line);background:#fff}
  .examples{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .chip{border:1px solid var(--line);background:#f8faff;color:#42546f;border-radius:999px;
    padding:6px 11px;font-size:12.5px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:#b9c9e6;background:#eef4ff;color:var(--ink)}
  .chip:disabled{opacity:.5;cursor:not-allowed}
  .composer{display:flex;gap:10px;align-items:flex-end;background:#f6f8fc;border:1px solid var(--line);
    border-radius:14px;padding:8px 8px 8px 14px;transition:.15s}
  .composer:focus-within{border-color:#b9c9e6;background:#fff}
  textarea{flex:1;border:0;background:transparent;resize:none;outline:none;font:inherit;font-size:14.5px;
    line-height:1.5;max-height:120px;padding:6px 0;color:var(--ink)}
  textarea:disabled{opacity:.6}
  .send{width:38px;height:38px;border:0;border-radius:10px;background:var(--brand);color:#fff;
    cursor:pointer;display:grid;place-items:center;flex:0 0 auto;font-size:15px;transition:.15s}
  .send:disabled{opacity:.45;cursor:not-allowed}
  .hint{font-size:11.5px;color:var(--muted);margin-top:8px;text-align:right}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media(max-width:560px){body{padding:0}.app{height:100dvh;border:0;border-radius:0}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">🛒</div>
    <div>
      <div class="title">数码 3C 客服</div>
      <div class="sub">意图分流 · 商品检索 · 多轮指代</div>
    </div>
    <div class="grow"></div>
    <button class="ghost" id="resetBtn" type="button">重置会话</button>
  </header>

  <main id="messages" aria-live="polite"></main>

  <footer>
    <div class="examples" id="examples">
      <button class="chip" type="button">有 AirPro 无线降噪耳机吗</button>
      <button class="chip" type="button">它多少钱</button>
      <button class="chip" type="button">支持七天无理由退货吗</button>
      <button class="chip" type="button">你好</button>
    </div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="问价格、库存、规格…" autofocus></textarea>
      <button class="send" id="sendBtn" type="submit" title="发送">➤</button>
    </form>
    <div class="hint">Enter 发送 · Shift + Enter 换行</div>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var messagesEl = document.getElementById("messages");
  var inputEl = document.getElementById("input");
  var sendBtn = document.getElementById("sendBtn");
  var resetBtn = document.getElementById("resetBtn");
  var composer = document.getElementById("composer");
  var chips = Array.prototype.slice.call(document.querySelectorAll(".chip"));

  var busy = false;
  var TIMEOUT_MS = 90000;

  function makeRow(kind, text) {
    var row = document.createElement("div");
    row.className = "row " + kind;
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    if (text) bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function addMessage(kind, text) {
    return makeRow(kind, text);
  }

  function addTyping() {
    var row = makeRow("bot", "");
    var bubble = row.querySelector(".bubble");
    var dots = document.createElement("span");
    dots.className = "typing";
    dots.append(document.createElement("i"), document.createElement("i"), document.createElement("i"));
    bubble.appendChild(dots);
    return row;
  }

  function postJSON(url, payload) {
    var controller = window.AbortController ? new AbortController() : null;
    var timer = controller ? setTimeout(function () { controller.abort(); }, TIMEOUT_MS) : null;
    var opts = {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload || {})
    };
    if (controller) opts.signal = controller.signal;
    return fetch(url, opts).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }).finally(function () {
      if (timer) clearTimeout(timer);
    });
  }

  function setBusy(value) {
    busy = value;
    sendBtn.disabled = value;
    inputEl.disabled = value;
    resetBtn.disabled = value;
    chips.forEach(function (c) { c.disabled = value; });
    inputEl.placeholder = value ? "客服正在输入…" : "问价格、库存、规格…";
    if (!value) inputEl.focus();
  }

  function autosize() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  }

  function send(text) {
    text = String(text || "").trim();
    if (!text || busy) return;

    setBusy(true);
    addMessage("me", text);
    inputEl.value = "";
    autosize();

    var typing = addTyping();

    postJSON("/chat", { query: text }).then(function (data) {
      typing.remove();
      addMessage("bot", data && data.answer ? data.answer : "（后端返回了空回复）");
    }).catch(function (err) {
      typing.remove();
      var msg = err && err.name === "AbortError"
        ? "等了 90 秒后端都没响应，已放弃本次请求。"
        : "请求失败：" + (err && err.message ? err.message : "未知错误") + "。请确认后端已启动（uvicorn api:app）。";
      addMessage("err", msg);
      if (!inputEl.value) {
        inputEl.value = text;
        autosize();
      }
    }).finally(function () {
      setBusy(false);
    });
  }

  function greet() {
    addMessage("bot", "你好，我是数码 3C 客服。可以问我商品价格、库存、规格，也可以随便聊聊。");
  }

  composer.addEventListener("submit", function (e) {
    e.preventDefault();
    send(inputEl.value);
  });

  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send(inputEl.value);
    }
  });
  inputEl.addEventListener("input", autosize);

  chips.forEach(function (chip) {
    chip.addEventListener("click", function () { send(chip.textContent); });
  });

  resetBtn.addEventListener("click", function () {
    if (busy) return;
    setBusy(true);
    postJSON("/reset").then(function () {
      messagesEl.innerHTML = "";
      greet();
      addMessage("bot", "（会话已重置，上下文和当前商品已清空）");
    }).catch(function (err) {
      addMessage("err", "重置失败：" + (err && err.message ? err.message : "未知错误"));
    }).finally(function () {
      setBusy(false);
    });
  });


  greet();
})();
</script>
</body>
</html>
